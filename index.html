<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap');

:root{
  --ink:#211815;
  --ink-soft:#4a3d37;
  --parchment:#EDE6D6;
  --parchment-deep:#E1D6BE;
  --card:#F8F3E8;
  --rust:#931635;
  --rust-deep:#650F26;
  --gold:#A9873F;
  --gold-soft:#C9AF7D;
  --line:rgba(33,24,21,.14);
  --line-soft:rgba(33,24,21,.08);
  --white:#FBF9F4;
  --shadow:0 18px 40px -22px rgba(33,24,21,.35);
  --serif:'Fraunces', Georgia, serif;
  --sans:'Work Sans', -apple-system, sans-serif;
}

:root{ color-scheme: light; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE6D6; --ink-soft:#c9bfae; --parchment:#1a1512; --parchment-deep:#0f0c0a;
    --card:#231c17; --line:rgba(237,230,214,.14); --line-soft:rgba(237,230,214,.08);
    --white:#161210; --gold-soft:#8a7345;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE6D6; --ink-soft:#c9bfae; --parchment:#1a1512; --parchment-deep:#0f0c0a;
  --card:#231c17; --line:rgba(237,230,214,.14); --line-soft:rgba(237,230,214,.08);
  --white:#161210; --gold-soft:#8a7345;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--parchment);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
@media(max-width:640px){.wrap{padding:0 20px;}}

h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.01em;}
p{margin:0;}

::selection{background:var(--rust);color:var(--white);}
:focus-visible{outline:2px solid var(--rust);outline-offset:3px;}

/* ---------- NAV ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 40px;
  transition:background .4s ease, padding .4s ease, box-shadow .4s ease;
}
@media(max-width:900px){.nav{padding:18px 20px;}}
.nav.solid{
  background:rgba(237,230,214,.92);
  backdrop-filter:blur(10px);
  padding:14px 40px;
  box-shadow:0 1px 0 var(--line);
  border-bottom:2px solid var(--rust);
}
@media(max-width:900px){.nav.solid{padding:14px 20px;}}
.brand{display:flex;align-items:center;color:var(--white);}
.brand img{height:40px;width:auto;display:block;transition:opacity .2s ease;}
@media(max-width:640px){.brand img{height:30px;}}
.brand .logo-bordo{display:none;}
.nav.solid .brand .logo-white, .page-alt .brand .logo-white{display:none;}
.nav.solid .brand .logo-bordo, .page-alt .brand .logo-bordo{display:block;}

.nav-links{display:flex;align-items:center;gap:38px;color:var(--white);transition:color .4s ease;}
.nav.solid .nav-links, .page-alt .nav-links{color:var(--ink);}
.nav-links a{font-size:13.5px;letter-spacing:.04em;position:relative;padding:6px 0;transition:color .25s ease;}
.nav-links a::after{
  content:'';position:absolute;left:0;bottom:0;height:2px;width:0;
  background:var(--rust);transition:width .3s ease;
}
.nav-links a:hover, .nav-links a.active{color:var(--rust);}
.nav-links a:hover::after, .nav-links a.active::after{width:100%;}

.has-drop{position:relative;}
.dropdown{
  position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%) translateY(-6px);
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--rust);box-shadow:var(--shadow);
  padding:10px;min-width:190px;opacity:0;visibility:hidden;
  transition:opacity .25s ease, transform .25s ease, visibility .25s ease;
}
.has-drop:hover .dropdown, .has-drop:focus-within .dropdown{
  opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);
}
.dropdown a{display:block;color:var(--ink);padding:11px 14px;font-size:13.5px;transition:background .2s,color .2s;}
.dropdown a:hover{background:rgba(122,42,30,.08);color:var(--rust);}
.dropdown a::after{display:none;}

.nav-right{display:flex;align-items:center;gap:34px;color:var(--white);transition:color .4s ease;}
.nav.solid .nav-right, .page-alt .nav-right{color:var(--ink);}
@media(max-width:900px){.nav-right{gap:20px;}}
.lang-switch{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;}
.lang-switch span{opacity:.45;}
.lang-switch button{background:none;border:0;padding:4px 2px;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;opacity:.6;border-bottom:2px solid transparent;transition:opacity .2s, color .2s, border-color .2s;}
.lang-switch button:hover{opacity:1;color:var(--rust);}
.lang-switch button.on{opacity:1;font-weight:600;border-bottom-color:var(--rust);}
.burger.open{color:var(--ink);}
.burger{z-index:210;}
.nav-cta{display:none;}
.burger{display:none;background:none;border:0;width:34px;height:26px;position:relative;color:inherit;}
.burger span{position:absolute;left:0;right:0;height:1.5px;background:currentColor;transition:transform .3s, opacity .3s;}
.burger span:nth-child(1){top:2px;}
.burger span:nth-child(2){top:12px;}
.burger span:nth-child(3){top:22px;}
.burger.open span:nth-child(1){transform:translateY(10px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-10px) rotate(-45deg);}

@media(max-width:900px){
  .nav-links{display:none;}
  .burger{display:block;}
}

.mobile-menu{
  position:fixed;inset:0;z-index:190;background:var(--parchment);
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:40px;
  transform:translateY(-100%);transition:transform .45s cubic-bezier(.6,0,.2,1);
}
.mobile-menu.open{transform:translateY(0);}
.mobile-menu a{font-family:var(--serif);font-size:30px;padding:14px 0;border-bottom:1px solid var(--line);}
.mobile-menu .sub a{font-size:19px;font-family:var(--sans);padding:10px 0 10px 18px;border:0;color:var(--ink-soft);}

/* ---------- HERO ---------- */
.hero{
  position:relative;height:100vh;min-height:640px;color:var(--white);
  display:flex;align-items:flex-end;overflow:hidden;
}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;}
.hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,14,11,.25) 0%,rgba(20,14,11,.15) 35%,rgba(20,14,11,.75) 100%);
}
.hero-content{position:relative;z-index:2;padding:0 40px 76px;width:100%;}
@media(max-width:640px){.hero-content{padding:0 20px 56px;}}
.hero-eyebrow{font-size:13px;letter-spacing:.24em;color:var(--gold-soft);margin-bottom:18px;}
.hero h1{font-size:clamp(48px,9vw,108px);line-height:.96;font-weight:500;}
.hero h1 em{font-style:italic;font-weight:400;color:var(--gold-soft);}
.hero-sub{margin-top:22px;max-width:460px;font-size:16.5px;color:rgba(251,249,244,.86);}
.hero-scroll{
  position:absolute;bottom:28px;right:40px;z-index:2;color:var(--white);
  display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;
  writing-mode:vertical-rl;
}
.hero-scroll::before{content:'';width:1px;height:44px;background:rgba(251,249,244,.5);}
@media(max-width:640px){.hero-scroll{display:none;}}

/* section generic */
.section{padding:120px 0;}
@media(max-width:640px){.section{padding:76px 0;}}
.section-alt{background:var(--card);}
.eyebrow{
  font-size:12.5px;letter-spacing:.2em;color:var(--rust);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--rust);flex:none;}
.section-head{max-width:640px;}
.section-head h2{font-size:clamp(32px,4.4vw,52px);}
.section-head p{margin-top:18px;color:var(--ink-soft);font-size:16px;max-width:520px;}
.lede{font-size:clamp(22px,2.6vw,30px);font-family:var(--serif);font-weight:400;line-height:1.4;max-width:760px;}

/* ---------- INTRO STRIP (home) ---------- */
.intro{padding:96px 0 40px;}
.intro-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:end;}
@media(max-width:840px){.intro-grid{grid-template-columns:1fr;gap:36px;}}
.stat-row{display:flex;gap:44px;margin-top:8px;flex-wrap:wrap;}
.stat b{display:block;font-family:var(--serif);font-size:34px;color:var(--rust);}
.stat span{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;}

/* ---------- feature split (genética teaser) ---------- */
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:0;align-items:stretch;}
@media(max-width:900px){.split{grid-template-columns:1fr;}}
.split-text{display:flex;flex-direction:column;justify-content:center;padding:70px 60px;}
@media(max-width:900px){.split-text{padding:56px 24px;}}
.split-photos{display:grid;grid-template-columns:1fr 1fr;}
.split-full{grid-template-columns:1fr;}
.split-full .split-photo{aspect-ratio:3/2;}
@media(max-width:640px){.split-full .split-photos{grid-template-columns:1fr;}}
.split-photo{position:relative;overflow:hidden;aspect-ratio:4/3;}
.split-photo img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1);}
.split-photo:hover img{transform:scale(1.06);}
.split-photo::before{
  content:'';position:absolute;inset:0;background:var(--rust);opacity:0;
  mix-blend-mode:multiply;transition:opacity .4s ease;pointer-events:none;
}
.split-photo:hover::before{opacity:.12;}
.split-photo .cap{
  position:absolute;left:0;right:0;bottom:0;padding:26px 24px;color:var(--white);
  background:linear-gradient(0deg,rgba(20,14,11,.85) 0%,rgba(20,14,11,.55) 55%,rgba(20,14,11,0) 100%);
  border-top:0;box-shadow:none;transition:box-shadow .3s ease;
}
.split-photo:hover .cap{box-shadow:inset 0 3px 0 var(--rust);}
.split-photo .cap b{font-family:var(--serif);font-size:22px;font-weight:500;display:block;}
.split-photo .cap span{font-size:12px;letter-spacing:.1em;color:var(--gold-soft);}

/* buttons / links */
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:15px 28px;
  border:1px solid var(--ink);font-size:13px;letter-spacing:.08em;margin-top:28px;
  transition:background .3s,color .3s,border-color .3s;
}
.btn:hover{background:var(--rust);color:var(--white);border-color:var(--rust);}
.btn.solid{background:var(--rust);border-color:var(--rust);color:var(--white);}
.btn.solid:hover{background:var(--rust-deep);border-color:var(--rust-deep);}
.text-link{
  display:inline-block;margin-top:22px;font-size:13.5px;color:var(--ink);
  border-bottom:1px solid var(--ink);padding-bottom:3px;
  transition:color .25s ease,border-color .25s ease;
}
.text-link:hover{color:var(--rust);border-color:var(--rust);}

/* ---------- ANIMAL GRID ---------- */
.animal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:56px;}
@media(max-width:960px){.animal-grid{grid-template-columns:repeat(2,1fr);gap:24px;}}
@media(max-width:600px){.animal-grid{grid-template-columns:1fr;}}
.animal-grid{align-items:start;}
.animal-card{cursor:pointer;}
.animal-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--parchment-deep);}
.animal-photo img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1);}
.animal-card:hover .animal-photo img{transform:scale(1.055);}
.animal-info{
  padding:18px 2px 0;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:16px;transition:border-color .25s ease;
}
.animal-card:hover .animal-info{border-color:var(--rust);}
.animal-info h3{font-size:21px;transition:color .25s ease;}
.animal-card:hover .animal-info h3{color:var(--rust-deep);}
.animal-info span{font-size:12px;letter-spacing:.08em;color:var(--rust);}

/* page hero (non-home) */
.page-hero{position:relative;height:56vh;min-height:400px;color:var(--white);display:flex;align-items:flex-end;overflow:hidden;}
.page-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.page-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,11,.35),rgba(20,14,11,.7));}
.page-hero-content{position:relative;z-index:2;padding:0 40px 56px;}
@media(max-width:640px){.page-hero-content{padding:0 20px 40px;}}
.page-hero h1{font-size:clamp(38px,7vw,72px);}
.crumb{font-size:12.5px;letter-spacing:.1em;color:var(--gold-soft);margin-bottom:14px;}

/* ---------- FICHA (individual page) ---------- */
.ficha-top{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;}
@media(max-width:900px){.ficha-top{grid-template-columns:1fr;gap:32px;}}
.ficha-photo{aspect-ratio:4/3;overflow:hidden;border-bottom:3px solid var(--rust);}
.ficha-photo img{width:100%;height:100%;object-fit:cover;}
.ficha-meta{display:flex;flex-direction:column;gap:4px;margin-top:26px;}
.ficha-meta-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.ficha-meta-row span:first-child{color:var(--ink-soft);}
.ficha-meta-row span:last-child{color:var(--rust-deep);font-weight:500;}

.tree{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px;margin-top:40px;}
.tree-node{width:200px;text-align:left;}
.tree-node .ph{width:100%;overflow:hidden;border:1px solid var(--line);border-top:3px solid var(--rust);background:var(--parchment-deep);}
.tree-node .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.tree-node b{display:block;font-family:var(--serif);margin-top:12px;font-size:17px;}
.tree-node span{font-size:11.5px;letter-spacing:.1em;color:var(--rust);}
.tree-connector{display:flex;align-items:center;color:var(--rust);opacity:.55;font-size:20px;padding-top:80px;}

.hijos-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:20px;align-items:start;}
@media(max-width:900px){.hijos-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.hijos-grid{grid-template-columns:repeat(2,1fr);}}
.hijos-grid .ph{overflow:hidden;background:var(--parchment-deep);}
.hijos-grid img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;display:block;}
.hijos-grid .ph:hover img{transform:scale(1.08);}
.hijos-grid .hijo{display:block;}
.hijos-grid .hijo b{display:block;margin-top:8px;font-size:13px;font-weight:500;color:var(--ink);text-align:center;}
.hijos-grid .hijo:hover b{color:var(--rust);}

/* ---------- QUIENES SOMOS ---------- */
.qs-hero{display:grid;grid-template-columns:1fr 1fr;gap:0;}
@media(max-width:900px){.qs-hero{grid-template-columns:1fr;}}
.qs-photo{aspect-ratio:4/3;overflow:hidden;}
.qs-photo img{width:100%;height:100%;object-fit:cover;}
.qs-text{display:flex;align-items:center;padding:70px 64px;}
@media(max-width:900px){.qs-text{padding:48px 24px;}}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:60px;}
@media(max-width:760px){.values{grid-template-columns:1fr;gap:32px;}}
.value b{font-family:var(--serif);font-size:22px;display:block;margin-bottom:10px;}
.value p{color:var(--ink-soft);font-size:14.5px;}
.placeholder-note{
  margin-top:60px;padding:20px 24px;border:1px dashed var(--gold);
  font-size:13px;color:var(--ink-soft);background:var(--card);
}

/* ---------- CHAMPION OF THE WORLD ---------- */
.cotw-head{display:flex;align-items:center;gap:44px;flex-wrap:wrap;}
.cotw-logo{width:240px;max-width:70%;height:auto;display:block;}
.cotw-logo-sm{width:150px;}
@media(max-width:640px){.cotw-logo{width:190px;}.cotw-logo-sm{width:130px;}}
.cotw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 32px;margin-top:56px;align-items:start;}
@media(max-width:900px){.cotw-grid{grid-template-columns:repeat(2,1fr);gap:28px 20px;}}
@media(max-width:520px){.cotw-grid{grid-template-columns:1fr;}}
.cotw-card{display:block;border-top:2px solid var(--line);padding-top:18px;transition:border-color .25s ease;}
.cotw-card:hover{border-top-color:var(--rust);}
.cotw-card .ph{overflow:hidden;background:var(--parchment-deep);}
.cotw-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
.cotw-card:hover img{transform:scale(1.04);}
.cotw-info{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:16px;row-gap:4px;margin-top:16px;}
.cotw-year{font-family:var(--serif);font-size:34px;line-height:1;color:var(--rust);grid-row:span 2;}
.cotw-year.multi{font-size:22px;max-width:70px;}
.cotw-info h3{font-size:19px;}
.medal{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
.medal i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;}
.medal-gold i{background:linear-gradient(135deg,#E3C46B,#A9873F);}
.medal-silver i{background:linear-gradient(135deg,#E4E4E4,#9C9C9C);}
.medal-bronze i{background:linear-gradient(135deg,#D9A06B,#8C5A2E);}
.medal-america i{background:var(--rust);}
.medal-america{color:var(--rust);}
/* ---------- NOTICIAS ---------- */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:56px;}
@media(max-width:900px){.news-grid{grid-template-columns:1fr;}}
.news-card{border-top:2px solid var(--line);padding-top:20px;transition:border-color .25s ease;}
.news-card:hover{border-top-color:var(--rust);}
.news-tag{font-size:11.5px;letter-spacing:.12em;color:var(--rust);}
.news-card h3{font-size:22px;margin-top:12px;}
.news-card p{color:var(--ink-soft);font-size:14px;margin-top:10px;}
.news-date{font-size:12px;color:var(--ink-soft);margin-top:16px;display:block;}

/* ---------- CONTACT ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;}
@media(max-width:840px){.contact-grid{grid-template-columns:1fr;gap:36px;}}
.contact-item{padding:26px 0;border-bottom:1px solid var(--line);transition:border-color .25s ease;}
.contact-item:hover{border-color:var(--rust);}
.contact-item span{display:block;font-size:12px;letter-spacing:.1em;color:var(--rust);margin-bottom:8px;}
.contact-item a, .contact-item p{font-family:var(--serif);font-size:23px;}

/* footer */
footer{background:var(--rust);color:var(--white);padding:70px 0 30px;}
.foot-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:40px;padding-bottom:50px;border-bottom:1px solid rgba(255,255,255,.22);}
.foot-brand{display:flex;align-items:center;gap:16px;}
.foot-brand img{height:46px;width:auto;display:block;}
.foot-links{display:flex;gap:60px;flex-wrap:wrap;}
.foot-col b{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.72);display:block;margin-bottom:16px;font-weight:500;}
.foot-col a{display:block;font-size:14px;margin-bottom:10px;color:var(--white);opacity:.94;transition:opacity .2s ease;}
.foot-col a:hover{opacity:.65;}
.foot-bottom{display:flex;justify-content:space-between;padding-top:26px;font-size:12px;color:rgba(255,255,255,.68);flex-wrap:wrap;gap:10px;}

/* reveal on scroll */

/* ============ MOUNT NAV / FOOTER ============ */
function mountChrome(){
  document.documentElement.lang = LANG;
  document.title = T('Cabaña Santa Cecilia — Genética consistente','Cabaña Santa Cecilia — Consistent genetics');
  document.getElementById('navContainer').innerHTML = navTemplate();
  document.getElementById('footContainer').innerHTML = footerTemplate();
  const burger = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');
  burger.addEventListener('click', ()=>{
    burger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });
  mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=>{
    burger.classList.remove('open'); mobileMenu.classList.remove('open');
  }));
  document.querySelectorAll('.lang-switch button').forEach(b=>b.addEventListener('click', ()=>setLang(b.dataset.lang)));
}
mountChrome();

/* ============ ROUTER ============ */
const app = document.getElementById('app');

function render(){
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  let html = '';
  let route = parts[0] || 'home';

  if(route === '' || route === 'home'){ html = homeTemplate(); route='home'; }
  else if(route === 'quienes-somos'){ html = quienesSomosTemplate(); }
  else if(route === 'genetica'){ html = geneticaTemplate(); }
  else if(route === 'toros' && !parts[1]){ html = animalListTemplate('toro'); }
  else if(route === 'donantes' && !parts[1]){ html = animalListTemplate('donante'); }
  else if(route === 'toro' && parts[1]){ html = animalFichaTemplate('toro', parts[1]); }
  else if(route === 'donante' && parts[1]){ html = animalFichaTemplate('donante', parts[1]); }
  else if(route === 'champion-of-the-world' || route === 'noticias'){ html = cotwTemplate(); route = 'champion-of-the-world'; }
  else if(route === 'contacto'){ html = contactoTemplate(); }
  else { html = notFoundTemplate(); }

  app.innerHTML = html;
  window.scrollTo(0,0);
  updateNavState(route);
  observeReveals();
}

function updateNavState(route){
  document.querySelectorAll('.nav-links a[data-route]').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });
  const isHome = route === 'home';
  document.body.classList.toggle('page-alt', !isHome);
  onScroll();
}

function observeReveals(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  els.forEach(e=>io.observe(e));
}

/* ============ NAV BEHAVIOR ============ */
function onScroll(){
  const navEl = document.getElementById('nav');
  if(!navEl) return;
  const isHome = !location.hash || location.hash === '#/' || location.hash === '';
  const solid = window.scrollY > 40 || !isHome;
  navEl.classList.toggle('solid', solid);
}
window.addEventListener('scroll', onScroll, {passive:true});

window.addEventListener('hashchange', render);
render();

</script>
